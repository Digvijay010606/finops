name: Infracost
on: [pull_request]
jobs:
  infracost:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: infracost/actions/setup@v3
        with: { api-key: "${{ secrets.INFRACOST_API_KEY }}" }
      - name: Baseline (base branch)
        run: |
          git checkout ${{ github.event.pull_request.base.ref }}
          infracost breakdown --path terraform --format json --out-file /tmp/base.json
      - name: Diff (PR branch)
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          infracost diff --path terraform --compare-to /tmp/base.json --format json --out-file /tmp/diff.json
      - name: Comment on PR
        run: infracost comment github --path /tmp/diff.json --repo $GITHUB_REPOSITORY --pull-request ${{ github.event.pull_request.number }} --github-token ${{ github.token }} --behavior update
